# Spoken descriptions for chapter 4, "Give the agent layered context": one for each example, read in its place.

[examples.schema-digest]
say = "The code builds the schema layer from all {{out:schema-digest:tables in the schema}} tables, about {{out:schema-digest:schema tokens (estimated)}} tokens, and prints the lines for the orders mart and the legacy orders table. Then it computes net revenue for March 2026 three ways that the schema allows: the legacy table's revenue column gives {{out:schema-digest:orders_legacy.revenue}}, the mart's net revenue over every order gives {{out:schema-digest:fct_orders.net_revenue_eur, every order}}, and the same column without cancelled orders gives {{out:schema-digest:fct_orders.net_revenue_eur, not cancelled}}."

[examples.column-descriptions]
say = "The code loads the {{out:column-descriptions:column notes}} column notes, about {{out:column-descriptions:column notes tokens (estimated)}} tokens, and prints the notes on the order status and on the UTC timestamp. Then it replays the recorded model's queries for the dev questions with the schema alone and with the notes added, and counts the questions the notes fixed, {{out:column-descriptions:fixed by column notes}}, and broke, {{out:column-descriptions:broken by column notes}}."

[examples.glossary-context]
say = "The code loads the {{out:glossary-context:glossary terms}} glossary terms, about {{out:glossary-context:glossary tokens (estimated)}} tokens, and prints the entry for revenue. Then it compares the recorded model's dev answers with column notes, and with column notes and the glossary: the glossary fixed {{out:glossary-context:fixed by the glossary}} questions and broke {{out:glossary-context:broken by the glossary}}. Last, it checks whether the March question's query still filters on order status with the glossary: {{out:glossary-context:gq-002 with the glossary filters status}}."

[examples.retrieve-similar-queries]
say = "The code indexes the {{out:retrieve-similar-queries:verified queries}} verified queries and, for two questions, prints the masked words and the three best matches with their scores. For the average order value by region in March 2026, the same measure for 2024 scores highest, and {{out:retrieve-similar-queries:aov matches kept}} matches pass the threshold. For which warehouse ships the most parcels, the best matches share only the word most, and {{out:retrieve-similar-queries:parcels matches kept}} pass. Last, it masks four short phrases: March 2026 and January 2025 both become a month and a number, calendar year 2024 keeps the words calendar and year, and a quarter written as Q3 isn't masked."

[examples.context-token-budget]
say = "The code builds the full context for the average-order-value question and prints each layer's estimated tokens. It compares the whole prompt's estimate, {{out:context-token-budget:prompt tokens (estimated)}} tokens, with the {{out:context-token-budget:prompt tokens (model's tokenizer)}} the model's tokenizer counted when it was recorded. Then it fits the context to 2,400 tokens twice: with the default priority, which drops {{out:context-token-budget:default dropped}} items including both verified queries, and with verified queries ranked above the glossary, which drops {{out:context-token-budget:examples first dropped}} glossary entries instead."

[examples.layer-ablation-dev]
say = "The code replays the recorded model's queries for the {{out:layer-ablation-dev:dev questions}} dev questions under four layer sets, grades each, and prints the totals and a grid of outcomes per question. The schema alone gets {{out:layer-ablation-dev:schema correct}} correct, column notes {{out:layer-ablation-dev:schema+columns correct}}, the glossary {{out:layer-ablation-dev:schema+columns+glossary correct}}, and verified queries {{out:layer-ablation-dev:schema+columns+glossary+verified correct}}. Against the run with the glossary, verified queries fixed {{out:layer-ablation-dev:fixed by verified queries}} questions and broke {{out:layer-ablation-dev:broken by verified queries}}."

[examples.missing-columns-schema-only]
say = "The code replays the recorded model's dev queries written with the schema alone, runs each, and for every query that fails, prints the column the database couldn't find and the tables that have it. Of the {{out:missing-columns-schema-only:schema-only queries that don't run}}, {{out:missing-columns-schema-only:missing column only analytics.dim_date has}} name a column only the date table has, {{out:missing-columns-schema-only:missing column only analytics.fct_order_lines has}} one only the order lines have, and {{out:missing-columns-schema-only:missing column only analytics.orders_legacy has}} one only the legacy orders table has."

[examples.what-stays-wrong]
say = "The code finds the dev questions that all four layers still don't get right, {{out:what-stays-wrong:not correct with all four layers}} of them, and prints each one's query, with the error for the one that doesn't run. Then it spells the tent category as the data stores it and grades that query again: {{out:what-stays-wrong:gq-007 with 'Tents' spelled as stored}}."

[examples.best-layers-on-test]
say = "The code chooses the layer set that scored best on the dev questions, {{out:best-layers-on-test:best on dev}}, then replays the recorded model on the {{out:best-layers-on-test:test questions}} test questions with the schema alone and with that set. The schema alone gets {{out:best-layers-on-test:test schema correct}} correct, and the best set {{out:best-layers-on-test:test best correct}}. Last, it scores each question in both splits against its closest verified query: the mean best score is {{out:best-layers-on-test:dev mean top retrieval score}} on dev and {{out:best-layers-on-test:test mean top retrieval score}} on test, and the closest pair, at {{out:best-layers-on-test:test closest score}}, is a test question."
