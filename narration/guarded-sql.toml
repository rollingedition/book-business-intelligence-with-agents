# Spoken descriptions for chapter 7, "Let the agent write SQL inside guards": one for each example, block and table.

[examples.agent-warehouse]
say = "The code builds the agent's own database, a second file holding copies of the marts the agent may read, and opens it read-only. The shop's warehouse has {{out:agent-warehouse:tables in the shop's warehouse}} tables, and the agent's database has {{out:agent-warehouse:tables in the agent's database}}, all in the analytics schema. Then it sends six queries straight to the agent's database, with no guard in front. A query on the raw customers table fails with a catalog error, because the raw schema isn't there, and so does a query on the legacy orders mart. Attaching the shop's file and reading a file both fail because file system operations are disabled, loading an extension fails, and switching file access back on fails because the configuration is locked. Last, it reads Duck D B's own catalog, which lists {{out:agent-warehouse:catalog, tables it lists}} tables, {{out:agent-warehouse:catalog, settings it lists}} settings and {{out:agent-warehouse:catalog, database files it names}} database file."

[examples.role-database]
say = "The code builds three role databases from the shop: one for EMEA's regional lead, one for finance and one for support, each holding only that role's views of the marts. It sends each role one query that this chapter's guard accepts, first to a database with every mart whole, then to the role's own database. Counting the regions in the orders table gives {{out:role-database:EMEA's regional lead, every mart}} on every mart and {{out:role-database:EMEA's regional lead, role's database}} on the lead's database. Counting customers whose email starts customer zero zero zero four gives {{out:role-database:finance, every mart}} on every mart and {{out:role-database:finance, role's database}} on finance's database. Summing net revenue works on every mart, and on support's database fails with a binder error, because the column isn't there. Then it sends support's database a common table expression named after Duck D B's table catalog: it lists {{out:role-database:support, catalog bypass, tables listed}} tables, and none names a revenue column. Last, a delete fails because the database is read-only."

[examples.parse-agent-sql]
say = "The code replays the S Q L the model wrote in chapter 4 for net revenue in each of the shop's countries in 2025, which groups by a country column of the calendar table, and parses it. The tree's root is a {{out:parse-agent-sql:root}} statement, it reads the orders fact table and the calendar table, and every column is named with its table's alias. The guard refuses it with a column error, unknown column country, and its message then lists the columns of both tables. Duck D B, had it run the query, would have failed with a binder error saying the calendar table has no column named country. Then the code parses one string holding a select and a drop table, which gives two statements, and a query missing a closing parenthesis, whose parse error gives a description, a line and a column: the description expects a closing parenthesis, at line {{out:parse-agent-sql:parse error line}}, column {{out:parse-agent-sql:parse error column}}."

[examples.block-a-delete]
say = "The code parses a query whose common table expression deletes every refund over fifty euros and whose outer select counts them. The root is a {{out:block-a-delete:root}}, and walking the tree finds a select and a delete. The guard refuses it because the query contains a delete, and the agent's read-only database refuses it too, saying it can't execute a statement of type select on a database attached in read-only mode. Then the code builds a writable copy of the shop in a temporary folder and runs the query there: it answers {{out:block-a-delete:writable copy, the query's answer}}, and the refunds table goes from {{out:block-a-delete:writable copy, refunds before}} rows to {{out:block-a-delete:writable copy, refunds after}}."

[examples.block-raw-tables]
say = "The code lists the tables the guard allows, the ones in the agent's database. It tries six queries: one on a raw table, one on the legacy mart, one with no schema name, one that names a file as a table, one that reads a file through the read C S V function, and one that defines a common table expression named after Duck D B's table catalog inside a subquery and then reads the catalog outside it. The guard refuses all six, the last because it names Duck D B's catalog. Last, it checks every golden query against the allowlist: {{out:block-raw-tables:golden queries the allowlist refuses}} are refused, the golden queries for return on marketing spend and for duplicate sign-ups, which read raw tables."

[examples.explain-before-running]
say = "The code asks Duck D B for the plan of a sum over orders, order lines and refunds listed with no join keys. Its largest step is a cross product estimated at {{out:explain-before-running:no join keys, estimated rows}} rows, and the guard refuses it. The same sum joined on the order I D peaks at {{out:explain-before-running:joined on order_id, estimated rows}} rows. Across {{out:explain-before-running:golden queries estimated}} golden queries the largest estimate is {{out:explain-before-running:largest estimate among golden queries}}, the plan for units per order has a cross product, and {{out:explain-before-running:golden plans with a step that has no estimate}} plans have a step with no estimate, against a limit of {{out:explain-before-running:limit on estimated rows}} rows. Then it shows that S Q L glot's limit method replaces a top five query's limit, while the guard keeps {{out:explain-before-running:guard's limit on the top five}}. A query for every order is refused because it returns too many rows. Last, the sum with no join keys is run under a one-second timer alone, as if its estimate had let it through. It reads its rows in batches, so the timer stops it with a timeout, and the connection still answers the next query."

[examples.stop-a-slow-plan]
say = "The code checks a query whose filter compares each order I D with a constant sum over thirty million generated numbers, with its list functions let past the guard's function list. First it plans the same query with a small constant, eighteen, on the shop's connection, where Duck D B folds constants, and on the agent's database, where folding is off. Both plans are an aggregate over an empty result: Duck D B computed the constant while planning, found no order I D under it, and so read no rows, on either connection. Then a worker process on the shop's connection plans the full query under a half-second deadline: no plan comes back, and the worker isn't running afterwards. Last, the guard refuses the query as written, because its list functions aren't on the function list."

[examples.replay-guard-bypasses]
say = "The code replays the reviews' attempts to get past the guard, each first sent straight to the agent's database where that helps, then through the guard with its five-second limit. A common table expression named after Duck D B's table catalog returns, from the database alone, {{out:replay-guard-bypasses:CTE named duckdb_tables, database alone}}; the guard refuses it as the catalog, and the same trick on the settings catalog is refused too. The slow plan, and unnest inside a subquery, are refused as functions off the list. One row of every customer's name and email, {{out:replay-guard-bypasses:every email in one row, database alone}}, is refused as too large. A function that reads a setting, and a table named with its database, are refused by the parser. From the second review, a pattern match on each email repeated two hundred thousand times is refused as a function off the list. The database name and version, which alone return {{out:replay-guard-bypasses:database name and version, database alone}}, are refused as functions that read the instance. Six hundred nested subqueries are refused as nested too deeply. From the final review, a similar to pattern on each email is refused as an operator the guard doesn't allow, and a temporary macro named sum is refused as a statement that isn't a query. A join of orders to every customer who didn't place them runs. Then the code counts the text in one batch of rows of that pattern match, {{out:replay-guard-bypasses:regex, characters to match in one batch of 2,048 rows}} characters, all matched before Duck D B looks for an interrupt. The pattern match runs again with its two functions allowed, through a guard with a two-second limit: it is stopped with no answer, the worker isn't running afterwards, and the guard's next query runs. Before that, the temporary macro goes to a cursor of the agent's database alone, where the next sum of net revenue returns {{out:replay-guard-bypasses:temp macro named sum, database alone, the next sum}}, and then straight to the guard's worker, where the next sum is the real one, because each query gets a fresh cursor. Last, the inequality join's estimate is under the limit, and it joined {{out:replay-guard-bypasses:join on inequality, rows it joined}} rows, more than a hundred times the estimate."

[examples.transpile-to-snowflake]
say = "The code checks a query for net revenue by weekday and month in 2025 and transpiles the guard's output to snowflake. Kept in quotes, the table names stay lower case in quotes, which snowflake matches exactly. Without the quotes, the code prints the snowflake query: day name stays day name, s t r f time becomes to char with snowflake's format, and no function is passed through unknown. In duck D B, the first weekday comes back as {{out:transpile-to-snowflake:DuckDB's first weekday}}. Then it transpiles a query using duck D B's histogram aggregate, which is on the guard's function list but which S Q L glot doesn't know and writes out unchanged, and lists it as passed through."

[examples.repair-from-error]
say = "The code runs every answer question on the dev split, {{out:repair-from-error:layered, questions}} of them, through the guard twice: once with the schema-only S Q L from chapter 1 and once with chapter 4's layered S Q L. Where the guard refuses the S Q L or duck D B fails, it replays the model's one repair. Schema-only S Q L ran first time on {{out:repair-from-error:schema-only, ran first time}} questions and was refused or failed on {{out:repair-from-error:schema-only, refused or failed first}}; {{out:repair-from-error:schema-only, ran after repair}} ran after repair, and {{out:repair-from-error:schema-only, correct after repair}} of those were correct. Layered S Q L ran first time on {{out:repair-from-error:layered, ran first time}}, with {{out:repair-from-error:layered, correct first time}} correct, and was refused on {{out:repair-from-error:layered, refused or failed first}}, whose repair ran, with {{out:repair-from-error:layered, correct after repair}} correct. Then it prints two repairs: for net revenue by country, the model moves the country column to the orders table, and the query {{out:repair-from-error:gq-017 layered, after repair}}; for net revenue in fiscal 2026, the model drops the fiscal year and filters on the calendar year of the U T C timestamp, and the query {{out:repair-from-error:gq-001 schema-only, after repair}}."

[examples.long-tail-score]
say = "The code runs the long-tail questions, which no metric covers, through layered context, the guard and at most one repair, and prints each one's outcome with what it needs. {{out:long-tail-score:long tail questions on dev}} are on the dev split and {{out:long-tail-score:long tail questions on test}} on test. On dev, {{out:long-tail-score:long tail dev correct}} are correct; on test, {{out:long-tail-score:long tail test correct}}, and {{out:long-tail-score:long tail test declined}} declined, return on marketing spend, after the guard refused the raw spend table. For each wrong answer it prints the first row beside the golden one: the tent orders' revenue came back empty, gross margin came back too low, conversion came back as a percentage, duplicate sign-ups returned no rows, and the weekday question has the right revenue but fewer orders. Last, it adds a weekday dimension to a copy of the orders semantic model, asks for net revenue and orders by weekday in 2025, and the result matches the golden result: {{out:long-tail-score:gq-038 as a metric request matches golden}}."
