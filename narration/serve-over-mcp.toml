# Spoken descriptions for chapter 11, "Serve the semantic layer over MCP": one for each example, block and table.

[examples.list-metric-tools]
say = "The code builds the semantic server twice, once for the analyst and once for the support team, and connects to each in memory. Both list the same five tools, in name order: ask back, cannot answer, describe metric, list metrics and query metric. The analyst's list metrics tool returns {{out:list-metric-tools:analyst, metrics in list_metrics}} metrics and support's returns {{out:list-metric-tools:support, metrics in list_metrics}}, with every revenue metric gone, and each catalog is the same text the in-process agent puts in its prompt. Query metric takes metrics, group by, filters, order by and limit, and requires only metrics. {{out:list-metric-tools:tools marked read-only}} tools are marked read-only, and {{out:list-metric-tools:tools with a role input}} take a role."

[examples.role-bound-at-build]
say = "The code sends one request three times: E M E A's regional lead asking for net revenue by country in 2025, with a role of analyst added to the arguments. A server that takes the role as an argument believes it and returns every country in the shop. The semantic server built for E M E A's lead returns E M E A's countries only, {{out:role-bound-at-build:role bound at build, countries}}, and its provenance names the lead's role and the row filter, E M E A only. A server built from the environment, with the role and region a host would set, returns the same countries. Last, the code runs the request with no policy at all, straight on that server's own database, and still gets only E M E A's countries, because the database holds no other region's rows."

[examples.tool-result-with-provenance]
say = "The code sends three requests to the semantic server and prints what comes back. The finance team's refund rate by region for fiscal 2026, computed on finance's own database, returns structured rows, {{out:tool-result-with-provenance:finance, refund rate, rows}}, with a provenance that names the source, the metric, the S Q L, the filters, the role and how fresh the data is. The text block holds the same J S O N. A request with a misspelt dimension comes back as a tool error, whose text starts with the S D K's words, error executing tool query metric, and then suggests the right dimension. The support team's request for net revenue is not an error: it comes back as an answer that declines, with a reason that starts with forbidden."

[examples.semantic-server-tests]
say = "The code runs its tests, each on a server built for one role: E M E A's lead gets the golden result for G Q seventeen, the lead asking for ay-pack is declined as forbidden, the lead's server's own database, queried directly, holds no other region's orders, support's catalog hides every metric that reads revenue, marketing's small groups are suppressed, and a misspelt dimension is a tool error that suggests the right one. It reports {{out:semantic-server-tests:tests passed}}. Then it sends the lead's request to a server built for the analyst, and the result does not match the lead's golden result, because the analyst's server returns every country. So the first test would catch a server that lost its binding."

[examples.host-asks-the-server]
say = "The code runs every golden question twice with the book's agent loop and recorded model: in process, as chapter 9 measured it, and as a host whose every tool call goes through an in-memory client to a semantic server built for the asker's role. For G Q seventeen, the host calls list metrics to fill the prompt, then query metric. Over M C P, the agent gets {{out:host-asks-the-server:dev answer correct over MCP}} dev answer questions right and {{out:host-asks-the-server:test answer correct over MCP}} on test, the same as in process, and declines every forbidden question. {{out:host-asks-the-server:runs with a tool error}} runs met a tool error, and the outcome is the same as in process for {{out:host-asks-the-server:same outcome as in process}} questions. The two that changed, G Q thirteen and G Q fourteen, orders in May 2026, first filtered on the order date, were told to filter by month, and over M C P asked the person back whether they meant the whole month or a single day, instead of correcting the request."
