# Spoken descriptions for chapter 8, "Say when the answer can't be given": one for each example, block and table.

[examples.unanswerable-cases]
say = "The code prints the eight golden questions whose right answer is a decline, each with its split, its type, ambiguous or unanswerable, and its category in the research's terms. For the four unanswerable ones it searches every column name in both schemas for words such as ship, deliver, view or forecast, and finds none, and it finds the products' unit cost when it searches for cost. It prints the refund reasons, one of which is late delivery, and the last order day, {{out:unanswerable-cases:last order day}}. Then it ranks the regions in fiscal 2026 three ways: by net revenue the leader is {{out:unanswerable-cases:best region by net_revenue}}, by orders it's {{out:unanswerable-cases:best region by orders}}, and by the lowest refund rate it's {{out:unanswerable-cases:best region by refund_rate (lowest)}}. Last, it computes net revenue for the second quarter of 2025 as a calendar quarter, {{out:unanswerable-cases:net revenue, quarter 2025-04-01}} euros, and as the fiscal quarter, {{out:unanswerable-cases:net revenue, fiscal_quarter 2026-Q2}}."

[examples.cannot-answer-tool]
say = "The code prints the five kinds of decline and who decides each: the model may give not in data, forecast and no definition, and code gives stale and forbidden. A decline sent without a kind comes back as an error listing the three kinds the model may use, and one with a kind becomes an answer that says it can't be given. Then it replays the declining agent on the four dev decline questions and on the answerable question about customers who ordered in 2025. The forecast is declined as a forecast in {{out:cannot-answer-tool:gq-005 model calls}} call, best customers as no definition, and the cost of shipping as not in data in {{out:cannot-answer-tool:gq-021 model calls}} calls, after a first reply that left out the tool's name. Which region is doing best first asks for net revenue by customer region, ordered, with no period; the ranking check refuses it, and the run ends with a question back about the period, offering {{out:cannot-answer-tool:gq-020 options}}, after {{out:cannot-answer-tool:gq-020 model calls}} calls. The customers question is declined as not in data, with a reason about a filter."

[examples.stale-refunds]
say = "The code first shows that Duck D B's table catalog has no time column: {{out:stale-refunds:duckdb_tables() time columns}}. It prints when each of three tables was last loaded: orders at {{out:stale-refunds:data as of, analytics.fct_orders}}, refunds at {{out:stale-refunds:data as of, analytics.fct_refunds}} and customers at {{out:stale-refunds:data as of, analytics.dim_customers}}, and that refunds come at about {{out:stale-refunds:refunds per day}} a day. It measures how long after its order a refund comes: a median of {{out:stale-refunds:median days from order to refund}} days, {{out:stale-refunds:refunds within 30 days of the order}} within 30 days, {{out:stale-refunds:refunds within 45 days of the order}} within 45, and {{out:stale-refunds:longest days from order to refund}} days at the longest, which is the refund rate's settling window. Asked without a check, the semantic layer gives a refund rate of {{out:stale-refunds:refund rate, 2026-04, unchecked}} for April 2026, {{out:stale-refunds:refund rate, 2026-05, unchecked}} for May and {{out:stale-refunds:refund rate, 2026-06, unchecked}} for June. From the twelve settled months, whose rate is {{out:stale-refunds:refund rate, settled months}}, it estimates how short May and June are: June by {{out:stale-refunds:2026-06, points short, refunds not loaded}} points of refunds not loaded and {{out:stale-refunds:2026-06, points short, refunds not happened yet}} of refunds not yet made, and May by {{out:stale-refunds:2026-05, points short, refunds not loaded}} and {{out:stale-refunds:2026-05, points short, refunds not happened yet}}. The freshness check finds the orders complete for June and the refunds short, for both reasons. For new customers in June, it checks the orders feed instead of the customers table, and finds it complete. The declining agent's query tool declines June's and May's refund rates as stale, naming the refunds' last load and the last day the month's refunds can come, and answers April's."

[examples.answer-with-provenance]
say = "The code replays three of the declining agent's runs and prints each answer with its provenance. For net revenue by region in March 2026 it prints the three regional totals, net revenue's definition, the month filter, the analyst role, when the data was loaded, the orders feed's freshness, complete, and the S Q L that ran, and the outcome is {{out:answer-with-provenance:gq-002 outcome}}. For total revenue by sales region in 2025 it prints three totals of gross revenue, whose definition says it includes tax, and the outcome is {{out:answer-with-provenance:gq-012 outcome}}. For the cost of shipping it prints the decline, of kind not in data, with its reason and the finance role."

[examples.decline-precision-recall]
say = "The code replays chapter 6's metrics-first agent and this chapter's declining agent on the same 21 dev questions, 17 answerable and 4 to decline, and prints each agent's measures. Decline recall goes from {{out:decline-precision-recall:metrics-first decline recall}} to {{out:decline-precision-recall:declining decline recall}}, and decline precision from {{out:decline-precision-recall:metrics-first decline precision}} to {{out:decline-precision-recall:declining decline precision}}. Coverage goes from {{out:decline-precision-recall:metrics-first coverage}} to {{out:decline-precision-recall:declining coverage}}, and selective risk from {{out:decline-precision-recall:metrics-first selective risk}} to {{out:decline-precision-recall:declining selective risk}}. The penalty score with a cost of 3 for a wrong number goes from {{out:decline-precision-recall:metrics-first penalty score, c=3}} to {{out:decline-precision-recall:declining penalty score, c=3}}, and with a cost of 10 from {{out:decline-precision-recall:metrics-first penalty score, c=10}} to {{out:decline-precision-recall:declining penalty score, c=10}}. It also lists the questions each agent gave a wrong number for, and the answerable question the declining agent declined."

[[blocks]]
section = "measure-declines"
starts = "decline precision = correct declines / all declines"
say = "Five formulas. Decline precision is the correct declines divided by all declines. Decline recall is the correct declines divided by the questions whose right answer is a decline. Coverage is the questions answered with a number divided by the questions asked. Selective risk is the wrong numbers divided by the questions answered with a number. And the penalty score is the right answers plus the correct declines, minus c times the wrong numbers, all divided by the questions asked."
