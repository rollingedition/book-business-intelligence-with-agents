# Spoken descriptions for chapter 10, "Judge answers and catch regressions": one for each example, block and table.

[examples.scorecard]
say = "The code replays three of the book's agents, schema-only S Q L, metrics first and declining, on the 21 answer and decline questions of each split, and prints a scorecard for each: correct answers with a Wilson interval, wrong numbers, failures, decline recall and precision, coverage, selective risk, and model calls and prompt tokens per question. On dev, metrics first and declining both get {{out:scorecard:dev declining correct}} right, an accuracy of {{out:scorecard:dev declining accuracy}}; the declining agent gives fewer wrong numbers and uses {{out:scorecard:dev declining prompt tokens per question}} prompt tokens a question. On the held-out test split, the declining agent gets {{out:scorecard:test declining correct}}, metrics first {{out:scorecard:test metrics-first correct}} and schema-only S Q L {{out:scorecard:test schema-only correct}}. Last, it lists the questions the declining prompt fixed and broke on each split: on dev it fixed {{out:scorecard:dev fixed by the declining prompt}} and broke {{out:scorecard:dev broken by the declining prompt}}, and on test it fixed {{out:scorecard:test fixed by the declining prompt}} and broke {{out:scorecard:test broken by the declining prompt}}."

[examples.renamed-column-caught]
say = "The code builds a copy of the shop's warehouse with one column of the orders mart renamed, net revenue E U R to net revenue ex tax E U R, and runs three checks that need no model. {{out:renamed-column-caught:golden SQL that fails}} golden queries fail to run. The metrics {{out:renamed-column-caught:metrics that fail}} fail to compile and run. And {{out:renamed-column-caught:recorded dev runs that no longer replay}} of the declining agent's recorded dev runs stop, because a tool returned an error the recorded model never saw. Then it changes the one line of the metric's definition in a copy of the semantic layer and runs the checks again: no metric fails, and {{out:renamed-column-caught:after the fix, recorded dev runs that no longer replay}} runs fail to replay."

[[blocks]]
section = "score-a-run"
starts = "centre   = (p + z² / 2n) / (1 + z² / n)"
say = "Three lines for the Wilson interval. The centre is p plus z squared over two n, divided by one plus z squared over n. The half width is z times the square root of p times one minus p over n, plus z squared over four n squared, all divided by one plus z squared over n. The interval runs from the centre minus the half width to the centre plus it."

[examples.judge-an-explanation]
say = "The code finds every golden question that both chapter 6's and chapter 8's agents declined, {{out:judge-an-explanation:pairs}} in all, and replays the judge's recorded verdict on their two reasons twice: once with chapter 6's reason first and once with chapter 8's first. For each question it prints the verdict in each order. The judge gave the same verdict in both orders on {{out:judge-an-explanation:same verdict in both orders}} pairs, and the first reason won in both orders on {{out:judge-an-explanation:first reason won in both orders}}. Chapter 6's reason won {{out:judge-an-explanation:metrics-first reason won in both orders}} times and chapter 8's {{out:judge-an-explanation:declining reason won in both orders}}, and the longer reason won {{out:judge-an-explanation:consistent winner was the longer reason}} of the consistent verdicts. It then splits the pairs into two groups: {{out:judge-an-explanation:pairs on decline questions}} on decline questions, and {{out:judge-an-explanation:pairs on answerable questions both agents declined}} on questions the warehouse can answer, which both agents declined wrongly. On those answerable questions, chapter 6's reason won {{out:judge-an-explanation:answerable questions both agents declined, metrics-first reason won in both orders}} and chapter 8's {{out:judge-an-explanation:answerable questions both agents declined, declining reason won in both orders}}, and chapter 8's reasons said the data lacks what was asked in {{out:judge-an-explanation:answerable questions, declining reasons that say the data lacks it}}, against {{out:judge-an-explanation:answerable questions, metrics-first reasons that say the data lacks it}} for chapter 6's. Last, it counts the judge's replies that mention an alternative or a way to reframe the question: {{out:judge-an-explanation:judge replies that suggest an alternative or a reframe}}."

[examples.judge-agreement]
say = "The code lists every distinct answer with a number that the three agents gave to an answer question, {{out:judge-agreement:cases}} in all, labels each correct or incorrect by comparing it with the golden result, and replays the judge's recorded verdict on each, given without the golden result. Overall, the judge agrees with the reference on {{out:judge-agreement:all observed agreement}} of the cases, with a Cohen's kappa of {{out:judge-agreement:all Cohen's kappa}} and a Scott's pi of {{out:judge-agreement:all Scott's pi}}. On schema-only S Q L's answers, agreement is {{out:judge-agreement:schema-only observed agreement}} and kappa {{out:judge-agreement:schema-only Cohen's kappa}}; on the metric agents' answers, agreement is {{out:judge-agreement:metric agents observed agreement}} and kappa {{out:judge-agreement:metric agents Cohen's kappa}}. For each group it also prints how far kappa moves when any one verdict is changed: on schema-only S Q L's {{out:judge-agreement:schema-only cases}} answers, anywhere from {{out:judge-agreement:schema-only kappa with any one verdict changed}}. The judge called {{out:judge-agreement:wrong answers the judge called correct}} wrong answers correct and {{out:judge-agreement:right answers the judge called incorrect}} right answers incorrect, and {{out:judge-agreement:right answers rejected for reading a year's filter as January 1}} of those rejections read a year's filter as keeping only its first day."

[[blocks]]
section = "calibrate-the-judge"
starts = "p_o          = cases where the judge and the reference agree / cases"
say = "Four lines. P O, the observed agreement, is the cases where the judge and the reference agree, divided by all cases. Chance agreement for kappa adds up, over the labels, the reference's share of each label times the judge's share of it. Chance agreement for pi adds up, over the labels, the square of each label's share of both raters' labels pooled. Kappa and pi are each the observed agreement minus their chance agreement, divided by one minus that chance agreement."

[examples.seed-variance]
say = "The code replays 12 dev questions five times for each of two agents, chapter 6's metrics-first agent and chapter 8's declining agent: once from the original recordings, made with seed 2718, and once for each of four more seeds. For each seed it prints how many questions were right. Across the seeds, the metrics-first agent got {{out:seed-variance:metrics-first correct across seeds}} right, and the declining agent {{out:seed-variance:declining correct across seeds}}. Then it lists the questions whose outcome changed with the seed: {{out:seed-variance:metrics-first questions that flip}} for metrics first, {{out:seed-variance:metrics-first flipping}}, and {{out:seed-variance:declining questions that flip}} for the declining agent. Last, it compares the declining agent's second run with seed 2718 against its first recording: {{out:seed-variance:seed 2718 again}}."

[examples.regression-gate]
say = "The code pairs the two agents' runs question by question on the same 12 dev questions. With one run each, the declining prompt fixed one question and broke one, and the sign test gives {{out:regression-gate:one run sign test p}}. With one run, the stable-break rule already flags {{out:regression-gate:one run stable breaks}}, because every flip counts as stable. With five runs each, it prints each question's correct runs under both agents; for G Q 8, {{out:regression-gate:gq-008}}. The mean paired difference is {{out:regression-gate:five runs mean paired difference}}, with a t interval, using a multiplier of {{out:regression-gate:t multiplier, 11 degrees of freedom}}, of {{out:regression-gate:five runs 95% interval}}. Then it finds the fewest questions that must turn from always wrong to always right for that interval to exclude zero: {{out:regression-gate:fewest clean flips the mean rule detects}}, a mean change of {{out:regression-gate:smallest mean change the mean rule detects}}. The gate's verdict is {{out:regression-gate:gate}}, because of a {{out:regression-gate:gate reason}}."
