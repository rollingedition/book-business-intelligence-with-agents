# Spoken descriptions for chapter 5, "Define metrics once in a semantic layer": one for each example, block and table.

[examples.load-semantic-models]
say = "The code loads the shop's semantic layer from its yamel files and counts {{out:load-semantic-models:semantic models}} semantic models and {{out:load-semantic-models:metrics}} metrics. For each semantic model it lists the table it reads, its entities with their types, and its dimensions. It prints net revenue's definition, a sum of net revenue in euros over the orders, where the order's status isn't cancelled, and checks every definition against the warehouse, finding {{out:load-semantic-models:problems in the shop's definitions}} problems. Then it checks a copy in which the order lines declare the order as their primary entity, and the check reports that the order repeats in many rows of the lines table."

[examples.compile-net-revenue]
say = "The code asks the semantic layer for net revenue grouped by the order's region, filtered to March 2026, and prints the request and the S Q L the compiler writes: one query over the orders table that leaves out cancelled orders, truncates each order's local business day to its month, and groups by region. It runs the query, prints a total for each of the three regions, and confirms that the answer matches the golden result: {{out:compile-net-revenue:matches golden}}. Then it sends a region filter that holds S Q L of its own, and shows that the value becomes one quoted text value, which matches no region. Last, it asks for a dimension the layer doesn't define, order colour, and prints the refusal, which lists every dimension net revenue can use."

[examples.entity-join-no-fanout]
say = "The code asks for net revenue by product category, and the semantic layer refuses: net revenue is summed per order, and categories are reached through the order lines, which have many rows per order. A hand-written join of orders to their lines shows why. Net revenue in 2025 is {{out:entity-join-no-fanout:net revenue, 2025}} euros, and summed over the joined lines it comes to {{out:entity-join-no-fanout:summed over the joined lines}}, inflated by {{out:entity-join-no-fanout:inflated by}}. Then it asks for the line-level metric by category, prints its S Q L and a total for each of the eight categories, and shows that they add up to {{out:entity-join-no-fanout:categories add up to}} euros, {{out:entity-join-no-fanout:difference from net revenue}} away from net revenue."

[examples.refund-rate-metric]
say = "The code compiles the refund rate by region for fiscal 2026 and prints its S Q L: refunds on the period's orders and gross revenue of those orders are each summed in their own subquery, then joined on region and divided. The rates are {{out:refund-rate-metric:refund rate, AMER}} for AMER, {{out:refund-rate-metric:refund rate, APAC}} for APAC and {{out:refund-rate-metric:refund rate, EMEA}} for EMEA. Averaging each order's own rate instead gives {{out:refund-rate-metric:average of per-order rates, AMER}}, {{out:refund-rate-metric:average of per-order rates, APAC}} and {{out:refund-rate-metric:average of per-order rates, EMEA}}. The country with the highest refund rate is {{out:refund-rate-metric:highest refund rate}}, which matches the golden answer, and average order value by region in March 2026 matches its golden result too."

[examples.fiscal-quarter-grain]
say = "The code groups net revenue by fiscal quarter in fiscal 2026 and prints the S Q L, which joins each order's local business day to the shop's calendar and groups by the calendar's quarter label, from 2026 Q1 to 2026 Q4. Then it groups net revenue by calendar quarter in 2025, whose quarters start in January, April, July and October, and prints the two first quarters side by side: {{out:fiscal-quarter-grain:fiscal 2026-Q1, February to April 2025}} euros for fiscal 2026's first quarter, and {{out:fiscal-quarter-grain:calendar 2025 Q1, January to March 2025}} for the calendar's. Last, it checks two golden questions about first fiscal quarters, net revenue in fiscal 2026's first quarter and by region in fiscal 2027's first quarter: {{out:fiscal-quarter-grain:gq-010 matches golden}} and {{out:fiscal-quarter-grain:gq-026 matches golden}}."

[examples.metricflow-agrees]
say = "The code compiles {{out:metricflow-agrees:requests compared}} metric requests with both metric flow and the book's compiler, from the same yamel files, runs both on the shop's warehouse and compares the rows, after turning metric flow's midnight timestamps into dates. It prints the type each returns for a month: a date time from metric flow, a date from the book's compiler. For each request it prints the metrics, the grouping, the number of rows and whether the results agree: {{out:metricflow-agrees:requests that agree}} agree. It prints the S Q L metric flow writes for net revenue by region in March 2026, with a comment naming each step, and shows that metric flow also refuses net revenue by product category in 2025, printing the cause its message lists: no valid join paths exist from the measure to the group-by item, because fan-out join support is pending."

[examples.metricflow-needs-a-date]
say = "The code builds metric flow's engine from the shop's yamel files, which works. Then it copies the files, points the order lines model at the analytics table of order lines, which has no order day, and removes the model's time dimension. Metric flow refuses to build its engine from the copy, with an invalid manifest exception whose message begins: invalid aggregation time dimension configuration."

[examples.transpile-metric-sql]
say = "The code compiles the refund rate by calendar quarter in 2025 once, then writes it in six dialects: duck D B, snowflake, big query, data bricks, postgres and T S Q L. For each it prints the line that truncates the date to a quarter, with the date column cast to a date first: big query gets date trunc, data bricks gets trunc, and T S Q L gets date trunc with an underscore, which isn't the name T S Q L documents. It also prints the line that divides, which gains a cast to a floating-point type for postgres and T S Q L. It shows that without the cast, big query would get timestamp trunc. Last, it translates a query that uses I LIKE to T S Q L with unsupported features set to raise an error, and the I LIKE passes through unchanged."

[[blocks]]
section = "entities-measures-dimensions"
starts = "semantic_model:"
say = "Two yamel documents. The first describes the orders semantic model: it reads the table fact orders in the analytics schema, counts its metrics on the order date by default, declares the order as its primary entity and the customer as a foreign one, and offers the order date, from the order's local business day at a daily grain, and the region as dimensions. The second defines net revenue as a simple metric: the sum of net revenue in euros, from the orders semantic model, with a filter that keeps orders whose status isn't cancelled."

[[tables]]
section = "compile-a-metric-request"
starts = "| Name | What it reaches |"
say = "A table of four dimension names and what each reaches. Order, double underscore, region is the region of the model whose primary entity is the order. Order, customer, region is the region of the order's customer, two joins away. Metric time, month is the metric's own time dimension, by month. And metric time, fiscal quarter is a fiscal quarter from the time spine, a custom grain, with a link to the fiscal section."
