# Spoken descriptions for chapter 3, "Build golden questions from your own work": one for each example, read in its place.

[examples.public-vs-own-score]
say = "The code loads the DABstep payments table into duck D B and replays the recorded model on the three DABstep tasks: for each, the model writes S Q L, the S Q L runs, and the model gives a final answer, which is compared with the task's answer. It also prints whether each task's S Q L ran: task forty-nine's didn't. It gets {{out:public-vs-own-score:DABstep correct}}. For task forty-nine, it then finds the top country by the number of fraudulent transactions, {{out:public-vs-own-score:task 49 top by count of frauds}}, and by the fraudulent share of payment volume, {{out:public-vs-own-score:task 49 top by fraud volume ratio}}. Last, it scores the same model's schema-only S Q L on the shop's dev questions: {{out:public-vs-own-score:shop dev correct}} correct."

[examples.load-golden-questions]
say = "The code loads the shop's golden questions and counts them: {{out:load-golden-questions:golden questions}} in all, {{out:load-golden-questions:answer}} to answer, {{out:load-golden-questions:decline}} to decline and {{out:load-golden-questions:forbidden}} forbidden for the role asking, with the declines split into {{out:load-golden-questions:decline, ambiguous}} ambiguous and {{out:load-golden-questions:decline, unanswerable}} unanswerable. It lists the roles that ask questions, then prints one question in full: the finance team's question about refunds on orders placed in March 2026, with its golden S Q L, which sums refunds by the order's month, its traps and its note. Last, it computes that total, {{out:load-golden-questions:refunded on orders placed in March 2026}} euros, and the other reading, refunds made in March 2026, {{out:load-golden-questions:refunded in March 2026, by refund month}} euros."

[examples.results-match-rules]
say = "The code takes the golden S Q L for net revenue in fiscal year 2026 and compares it with two other queries: one that sums order lines over a date range, and the golden query with its filter on cancelled orders removed. For each, it prints the total, whether the S Q L text is the same, whether it's the same after S Q L glot normalizes both, and whether the results match. Neither query has the same text, normalized or not. The order-lines query matches the golden result, {{out:results-match-rules:by lines results match}}, and the query that forgets cancelled orders doesn't, {{out:results-match-rules:forgets cancelled results match}}."

[examples.tolerant-comparison]
say = "The code takes the golden result for net revenue in each region in March 2026, with a tolerance of {{out:tolerant-comparison:tolerance}}, and compares it with changed versions of itself. Reversed rows, swapped columns, an extra month column and rounding to whole euros all match. Rounding to thousands, reporting in thousands of euros and leaving out a region don't match, and neither does a reversed ranking when order matters. Then it takes the conversion rates of golden question thirty-three, from {{out:tolerant-comparison:gq-033 rates}}, and adds 0.004 to each. Under that question's own absolute slack, {{out:tolerant-comparison:gq-033 absolute slack}}, the near miss doesn't match. With half a cent of slack, it would."

[examples.gold-runs-and-agrees]
say = "The code runs the golden S Q L of every answerable question and checks each result: {{out:gold-runs-and-agrees:golden SQL that runs}} run, none fails, and {{out:gold-runs-and-agrees:empty or NULL results}} are empty or hold a null. Of the {{out:gold-runs-and-agrees:questions with a check query}} questions with an independent check query, {{out:gold-runs-and-agrees:checks that agree}} agree. Then it finds the top country for refunds in fiscal 2026 two ways: by the number of refunds, {{out:gold-runs-and-agrees:top country by number of refunds}}, and by refund rate, {{out:gold-runs-and-agrees:top country by refund rate}}, which is the golden answer to the refund-rate question."

[examples.reworded-golden-question]
say = "The code prints the gold for golden question thirty-one, {{out:reworded-golden-question:gq-031 golden}}, then replays the baseline's recorded S Q L for the question in its old wording, about items, and its new wording, about units, counting quantities rather than order lines. For each it prints the wording, the answer and the outcome: {{out:reworded-golden-question:baseline answer, items wording}}, which is wrong, and {{out:reworded-golden-question:baseline answer, units wording}}, which is correct."

[examples.golden-coverage]
say = "The code counts the golden questions in each split, {{out:golden-coverage:dev questions}} in dev and {{out:golden-coverage:test questions}} in test, and then by kind, the same in both, then the answerable questions in each split by role, where marketing and support appear only in the test split. Last, it counts each warehouse trap in each split and lists the traps missing from a split: {{out:golden-coverage:traps missing from a split}}."

[examples.baseline-on-both-splits]
say = "The code scores schema-only S Q L on every golden question and prints the outcomes per split. On dev it gets {{out:baseline-on-both-splits:dev correct}} correct, {{out:baseline-on-both-splits:dev wrong}} wrong and {{out:baseline-on-both-splits:dev error}} errors, an accuracy of {{out:baseline-on-both-splits:dev accuracy}}. On test it gets {{out:baseline-on-both-splits:test correct}} correct, an accuracy of {{out:baseline-on-both-splits:test accuracy}}. Across both splits it gets {{out:baseline-on-both-splits:answer correct, both splits}} answerable questions right, {{out:baseline-on-both-splits:decline correct, both splits}} declines and {{out:baseline-on-both-splits:forbidden correct, both splits}} forbidden questions."
