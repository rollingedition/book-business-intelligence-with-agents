# Spoken descriptions for chapter 6, "Route questions to governed metrics first": one for each example, block and table.

[examples.metric-tools]
say = "The code builds the metrics-first prompt from the shop's semantic layer and prints the agent's five tools, the number of metrics in the prompt, {{out:metric-tools:metrics in the prompt}}, and the number of tables, {{out:metric-tools:tables in the prompt}}. It prints net revenue's line of the catalog, its description followed by the dimensions it can use, and what the describe tool returns for the refund rate: its definition, its time grains, and the values of each dimension, such as the three regions and the fiscal quarters. Last, it reads from the two recordings how many tokens the first prompt for net revenue by region in March 2026 held: {{out:metric-tools:schema-only prompt tokens}} with the schema, and {{out:metric-tools:metrics-first prompt tokens}} with the metrics."

[examples.model-returns-a-request]
say = "The code replays the recorded agent on net revenue by sales channel in calendar 2025. The run takes {{out:model-returns-a-request:model calls}} model call, whose reply asks the query tool for net revenue, grouped by the order's channel and filtered to the year 2025. The code prints that reply, the metric request parsed from it, the S Q L the semantic layer compiled, and the revenue for each of the four channels, which matches the golden result: {{out:model-returns-a-request:matches golden}}. The same question under schema-only S Q L ends with the outcome {{out:model-returns-a-request:schema-only outcome}}."

[examples.reject-unknown-dimension]
say = "The code validates three requests: orders by customer email, which no metric defines; net revenue by product category, which two other metrics can reach; and net revenue for a region called Europe, which no row has. Each is refused with a message naming what's allowed, and the Europe request, run without the check, returns an empty total. Then it replays the model's own first request for net revenue by region in March 2026, which filtered the daily order date to the month. Run without validation, it covers March 1 alone, {{out:reject-unknown-dimension:unchecked total}} euros against a golden {{out:reject-unknown-dimension:golden total}}. The code prints validation's refusal, the model's corrected request on the month, and that its answer matches the golden result: {{out:reject-unknown-dimension:matches golden}}."

[examples.clarify-best-customers]
say = "The code replays the four dev questions of kind decline, and prints the tool each run ended with. The forecast and best customers ended by asking back, which region is doing best ended in a metric query, and the cost of shipping ended in a decline. It prints the question the agent asked about best customers, highest net revenue or most orders, with each metric's definition from the layer, and the question it asked about the forecast, the calendar or the fiscal quarter. It prints the request the agent made for which region is doing best, net revenue by the customer's region with no period, and the all-time revenue it returned for each region. Last, it applies the ranking check to the last request of the {{out:clarify-best-customers:runs with a result}} recorded runs that returned a result. Only {{out:clarify-best-customers:requests that order their result}} of them orders its result, and the check flags {{out:clarify-best-customers:ranking check flags}}, which ranks over no period."

[examples.metrics-first-score]
say = "The code replays every golden question through the metrics-first agent and through schema-only S Q L, and counts the outcomes per split. On the dev split, metrics-first gets {{out:metrics-first-score:dev metrics-first correct}} right and schema-only S Q L {{out:metrics-first-score:dev schema-only correct}}. On the held-out test split, metrics-first gets {{out:metrics-first-score:test metrics-first correct}} and schema-only S Q L {{out:metrics-first-score:test schema-only correct}}. Runs that used all four model calls without an answer are counted apart, as step limit: {{out:metrics-first-score:dev metrics-first step limit}} on dev and {{out:metrics-first-score:test metrics-first step limit}} on test. For each split it also prints the forbidden questions answered, the model calls, the requests validation refused, the runs that reached a correct answer after a refusal, how often the agent asked back on each kind of question, and the questions it didn't get right."

[examples.metrics-first-misses]
say = "The code replays every metrics-first run and, for each one that wasn't correct, prints the question, its split and outcome, and each model call: the tool and arguments it sent and the first line of what came back. Net revenue from orders with a tent took {{out:metrics-first-misses:gq-007 model calls}} calls: two filter requests that were refused, then two describe calls whose arguments weren't a JSON object, and it ended at the step limit. Each country's revenue for the regional lead returned {{out:metrics-first-misses:gq-017 rows}} rows. It also prints the correct request for total revenue in 2025, which used net revenue. Last, it asks the layer for the five products with the most net revenue in 2025, with the order written as minus line net revenue, and that request matches the golden result: {{out:metrics-first-misses:gq-039 from the layer, matches golden}}."
