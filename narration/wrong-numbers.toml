# Spoken descriptions for chapter 2, "Where raw text-to-SQL gets the number wrong": one for each example and table, read in its place.

[examples.tent-orders-fan-out]
say = "The code replays the model's query for net revenue from orders that included a tent in 2025: it joins orders to their lines and products, keeps products whose name contains tent, and sums each joined row's order revenue. The join matched {{out:tent-orders-fan-out:rows the join matched}} rows from {{out:tent-orders-fan-out:orders behind them}} orders. The model's answer is {{out:tent-orders-fan-out:model's answer}}; counting each order once gives {{out:tent-orders-fan-out:each order counted once}}, so the fan-out inflated it by {{out:tent-orders-fan-out:inflated by}}. Counting the whole tents category once per order gives {{out:tent-orders-fan-out:tents and shelters, counted once}}, and the golden answer is {{out:tent-orders-fan-out:golden}}. Last, it joins every order of 2025 to all its lines with no product filter: orders have {{out:tent-orders-fan-out:lines per order}} lines on average, and the joined sum is {{out:tent-orders-fan-out:all 2025 orders joined to their lines, sum over true sum}} times the true one."

[examples.gross-or-net-revenue]
say = "The code replays the model's query for total revenue in 2025, which sums gross revenue over orders placed in 2025 by UTC time, then changes one choice at a time. The model's answer is {{out:gross-or-net-revenue:model's answer (gross)}}. Net revenue on the same rows is {{out:gross-or-net-revenue:net instead of gross}}, without cancelled orders it is {{out:gross-or-net-revenue:without cancelled orders}}, and on local business days it reaches the golden {{out:gross-or-net-revenue:golden (local business days)}}. The tax in the gross figure is {{out:gross-or-net-revenue:tax in the gross figure}}, and the model overstated revenue by {{out:gross-or-net-revenue:overstated by}}."

[examples.fiscal-year-and-local-day]
say = "The code replays two of the model's queries. For customers whose first order was in fiscal year 2026, the model counted first orders in calendar 2026 and got {{out:fiscal-year-and-local-day:gq-004 model}}, where the golden answer is {{out:fiscal-year-and-local-day:gq-004 golden}}. For orders per region in May 2026, the model filtered on the UTC timestamp: AMER {{out:fiscal-year-and-local-day:gq-013 AMER model}} against a golden {{out:fiscal-year-and-local-day:gq-013 AMER golden}}, APAC {{out:fiscal-year-and-local-day:gq-013 APAC model}} against {{out:fiscal-year-and-local-day:gq-013 APAC golden}}, and EMEA the same. It finds {{out:fiscal-year-and-local-day:orders across May's edges}} orders that fall in May by one clock and not the other, and counts them by region and direction: in AMER, {{out:fiscal-year-and-local-day:gq-013 AMER in May by local day only}} in May only by the local day and {{out:fiscal-year-and-local-day:gq-013 AMER in May by UTC only}} only by UTC; in APAC, {{out:fiscal-year-and-local-day:gq-013 APAC in May by UTC only}} only by UTC; in EMEA, none."

[examples.legacy-table-answer]
say = "The code sums the legacy table's revenue column by sales region for 2025 and prints it beside the golden net revenue for each region. For EMEA the legacy table says {{out:legacy-table-answer:EMEA orders_legacy}} and the golden answer is {{out:legacy-table-answer:EMEA golden}}; in total the legacy table is {{out:legacy-table-answer:legacy total over golden}} over, and its 2025 rows hold {{out:legacy-table-answer:test orders in the legacy rows}} test orders. It then checks the model's queries for golden questions one to sixteen, and finds that {{out:legacy-table-answer:model queries that read orders_legacy}} read the legacy table. It also counts the golden questions this chapter added: {{out:legacy-table-answer:golden questions added in chapter 2, gq-006 to gq-016}}."

[examples.cancelled-lines-counted]
say = "The code prints and replays the model's query for units sold by product category in 2025, which sums quantities from the order lines mart with no condition on the order's status, and compares it with the golden answer. For Cooking the model says {{out:cancelled-lines-counted:Cooking model}} and the golden answer is {{out:cancelled-lines-counted:Cooking golden}}; across all categories, {{out:cancelled-lines-counted:all categories model}} against {{out:cancelled-lines-counted:all categories golden}}, overstated by {{out:cancelled-lines-counted:overstated by}}. Cancelled orders account for {{out:cancelled-lines-counted:units on cancelled orders, in the model's dates}} units, and the raw tables hold {{out:cancelled-lines-counted:units on test orders, which the marts already leave out}} units on test orders that the marts leave out. Orders whose UTC and local days fall in different years add a net {{out:cancelled-lines-counted:net units on orders across the year's edges}} units."

[examples.classify-schema-only-errors]
say = "The code replays the model's query for each golden question so far that has an answer, {{out:classify-schema-only-errors:questions graded}} in all, grades each result as correct, wrong or error, and labels each query with the kinds of failure it finds by comparing it with the golden query. It prints a row per question, the database's message for each query that failed, and the totals: {{out:classify-schema-only-errors:correct}} correct, {{out:classify-schema-only-errors:wrong}} wrong and {{out:classify-schema-only-errors:error}} errors, of which {{out:classify-schema-only-errors:errors with a missing column}} name a missing column and {{out:classify-schema-only-errors:errors with a type mismatch}} a type mismatch. Among the wrong answers, {{out:classify-schema-only-errors:wrong answers with time}} have a time error, {{out:classify-schema-only-errors:wrong answers with unwritten filter}} an unwritten filter, {{out:classify-schema-only-errors:wrong answers with definition}} a definition, {{out:classify-schema-only-errors:wrong answers with fan-out}} a fan-out, and {{out:classify-schema-only-errors:wrong answers with tempting table}} the tempting table. For the customer count, {{out:classify-schema-only-errors:gq-016 customers with an order across 2025's edges}} customers had an order at the year's edges, and {{out:classify-schema-only-errors:gq-016 of them, with other 2025 orders by both clocks}} of them had other orders in 2025 by both clocks."

[[tables]]
section = "count-failures-by-kind"
starts = "| Kind in this book | Nearest published class |"
say = "A table pairing each of the book's five kinds with its nearest class in published taxonomies. Fan-out is closest to join condition mismatch and aggregate functions in NL2SQL-BUGs. A definition has no class there; the closest is a domain-knowledge mismatch in the CIDR audit. Time matches date and time functions, the tempting table matches table mismatch, and an unwritten filter matches implicit or explicit condition missing."
