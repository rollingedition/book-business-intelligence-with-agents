term = "binding the role at build"
aliases = ["role binding", "bind the role"]
context = "ai-agents"
definition = "Binding the role at build means one server per person, which is what stdio gives you: the host starts a process for its user, and the process lives as long as the host needs it"
section = "carry-the-role"
example = "role-bound-at-build"

[[concepts]]
id = "token-verifier"
