# The terms this book defines, each quoted from its own sentence (writing standards W-77 to W-80).

context = "artificial-intelligence"

[[concepts]]
id = "raw-schema"
term = "raw schema"
context = "data-warehousing"
definition = "The `raw` schema holds what the source systems loaded: orders, order lines, refunds, customers, products, sessions, marketing spend and exchange rates."
section = "meet-the-shop"
example = "load-the-warehouse"

[[concepts]]
id = "analytics-schema"
term = "analytics schema"
context = "data-warehousing"
definition = "The `analytics` schema holds the marts built from the raw tables in SQL, such as `fct_orders`, one row per real order with its amounts in euros."
section = "meet-the-shop"
example = "load-the-warehouse"

[concepts.relations]
computed-from = ["raw-schema"]

[[concepts]]
id = "fiscal-year"
term = "fiscal year"
aliases = ["fiscal years"]
context = "data-warehousing"
definition = "The shop's fiscal year starts on February 1, and is named for the year it ends in."
section = "meet-the-shop"
example = "fiscal-year-and-local-day"

[[concepts]]
id = "schema-only-text-to-sql"
term = "schema-only text-to-SQL"
aliases = ["schema-only SQL"]
definition = "Schema-only text-to-SQL means the model is given the name and type of every column and the person's question, and nothing else, and writes the SQL."
section = "ask-for-sql"
example = "first-question-to-sql"

[concepts.relations]
contrasts-with = ["data-warehousing/metric"]

[[concepts]]
id = "recording"
term = "recording"
aliases = ["recordings"]
definition = "A recording is a saved set of model replies with a manifest, made once by a script in the repository's `recordings/` folder and replayed by the examples."
section = "ask-for-sql"
example = "first-question-to-sql"

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/llm-evaluation/recording"]


[[concepts]]
id = "golden-question"
term = "golden question"
aliases = ["golden questions"]
context = "llm-evaluation"
definition = "A golden question is a question with its checked answer: the kind of answer expected and, when the answer is a result, the golden SQL, written against the owner's definition, and the golden result that SQL returns."
section = "check-the-first-number"
example = "run-the-model-sql"

[[concepts]]
id = "golden-result"
term = "golden result"
aliases = ["golden results"]
context = "llm-evaluation"
definition = "the golden result: the question's answer from SQL written against the finance team's definitions and checked by running it"
section = "wrong-numbers"
example = "run-the-model-sql"

[concepts.relations]
part-of = ["golden-question"]

[[concepts]]
id = "net-revenue"
term = "net revenue"
context = "data-warehousing"
definition = "The golden SQL for `gq-002` follows the shop's definition of net revenue, which the finance team owns: revenue in euros after discounts and before tax, from real orders that weren't cancelled, on the order's local business day."
section = "check-the-first-number"
example = "run-the-model-sql"

[concepts.relations]
broader = ["metric"]


[[concepts]]
id = "metric"
term = "metric"
aliases = ["metrics", "defined metric"]
context = "data-warehousing"
definition = "A metric is a business measure written down once, by the people who own it: a name, a description a person can check, how it is computed from the marts, the rule for which rows count, and the dimensions it may be grouped and filtered by."
section = "answer-from-a-metric"
example = "one-metric-answer"

[concepts.relations]
prerequisite-of = ["metric-request"]

[[concepts]]
id = "metric-request"
term = "metric request"
aliases = ["metric requests"]
context = "data-warehousing"
definition = "A metric request names the metric, the dimensions to group by and one value per filtered dimension, and `compile_request()` turns it into SQL."
section = "answer-from-a-metric"
example = "one-metric-answer"

[[concepts]]
id = "tool"
term = "tool"
aliases = ["tools"]
context = "ai-agents"
definition = "A tool is a function the model may ask the code to run, by replying with a JSON object that names it and gives its arguments."
section = "answer-from-a-metric"
example = "one-metric-answer"
agrees = [{ book = "model-context-protocol-in-practice", definition = "A tool is a named action with a description and an input schema, and the model decides whether to call it and with what" }]

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/search-and-recommendation/tool"]


[[concepts]]
id = "correct-outcome"
term = "correct"
context = "llm-evaluation"
definition = "An answer is correct when the result matches the golden result, or when it declines a question that should be declined."
section = "score-five-questions"
example = "score-five-golden"

[concepts.relations]
measured-from = ["golden-question"]

[[concepts]]
id = "wrong-outcome"
term = "wrong answer"
aliases = ["wrong answers"]
context = "llm-evaluation"
definition = "A wrong answer returns a different result, or returns any result for a question that should be declined."
section = "score-five-questions"
example = "score-five-golden"

[concepts.relations]
measured-from = ["golden-question"]
contrasts-with = ["error-outcome"]

[[concepts]]
id = "error-outcome"
term = "error"
context = "llm-evaluation"
definition = "An error is an answer whose SQL doesn't run."
section = "score-five-questions"
example = "score-five-golden"

[concepts.relations]
contrasts-with = ["wrong-outcome"]


[[concepts]]
id = "false-refusal"
term = "declined"
context = "llm-evaluation"
definition = "A declined answer says it can't answer a question that has an answer."
section = "score-five-questions"
example = "score-five-golden"
agrees = [{ book = "evaluating-llm-applications", definition = "A false refusal is an answerable item declined" }]

[concepts.relations]
contrasts-with = ["wrong-outcome"]

[[concepts]]
id = "comparison-rule"
term = "comparison rule"
aliases = ["results_match()"]
context = "llm-evaluation"
definition = "The comparison rule, `results_match()` in `lib/golden.py`, accepts an answer when it has as many rows as the golden result and its columns include every golden column's values."
section = "score-five-questions"
example = "tolerant-comparison"

[concepts.relations]
prerequisite-of = ["execution-match"]

[[concepts]]
id = "trace"
term = "trace"
aliases = ["traces"]
context = "ai-agents"
definition = "The trace is every step of one run, kept by `run_agent()`: each model reply, and each tool result sent back."
section = "read-one-trace"
example = "print-one-trace"
agrees = [{ book = "agent-harnesses", definition = "The record of each step is the trace." }]

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/search-and-recommendation/trace"]


[[concepts]]
id = "fan-out"
term = "fan-out"
context = "data-warehousing"
definition = "Fan-out is what happens when a query joins a table to another that has several rows for each of its rows, and then sums or counts a column of the first."
section = "joins-that-fan-out"
example = "tent-orders-fan-out"

[concepts.relations]
broader = ["llm-evaluation/failure-kind", "failure-kind"]

[[concepts]]
id = "business-definition"
term = "business definition"
context = "data-governance"
definition = "Words such as revenue, order value or active customer have one meaning in a business, chosen by the people who own the number, and that meaning lives in a finance policy, a dashboard's SQL or someone's memory."
section = "definitions-not-in-schema"
example = "gross-or-net-revenue"

[concepts.relations]
narrower = ["data-warehousing/net-revenue"]

[[concepts]]
id = "local-business-day"
term = "local business day"
aliases = ["local business days"]
context = "data-warehousing"
definition = "The shop counts each order on its region's local business day, stored as `order_date_local` in the orders mart, beside the UTC timestamp `placed_at`."
section = "time-and-calendars"
example = "fiscal-year-and-local-day"

[[concepts]]
id = "legacy-table"
term = "legacy table"
aliases = ["legacy tables", "tempting table"]
context = "data-warehousing"
definition = "Most warehouses keep tables that nobody should query any more and nobody can drop: an older mart that old dashboards read, a copy from a migration, a table built for one analysis."
section = "the-tempting-table"
example = "legacy-table-answer"

[concepts.relations]
broader = ["llm-evaluation/failure-kind"]

[[concepts]]
id = "unwritten-filter"
term = "unwritten filter"
aliases = ["unwritten filters"]
context = "data-warehousing"
definition = "Some rules about which rows count are so familiar to the people who own a number that nobody writes them down: cancelled orders don't count as revenue, test accounts aren't customers, a refund belongs to the month of its order."
section = "unwritten-filters"
example = "cancelled-lines-counted"

[concepts.relations]
broader = ["llm-evaluation/failure-kind", "failure-kind"]

[[concepts]]
id = "nl2sql-bugs"
term = "NL2SQL-BUGs"
context = "llm-evaluation"
definition = "One detailed taxonomy, NL2SQL-BUGs, sorts semantic errors in text-to-SQL into 9 categories and 31 subcategories, from 2,018 expert-annotated cases, 999 of them wrong"
section = "definitions-not-in-schema"

[[concepts]]
id = "spider-2"
term = "Spider 2.0"
context = "llm-evaluation"
definition = "Spider 2.0, a benchmark of enterprise text-to-SQL tasks"
section = "the-tempting-table"

[concepts.relations]
broader = ["public-benchmark"]

[[concepts]]
id = "failure-kind"
term = "failure kind"
aliases = ["failure kinds", "kinds of plausible wrong number"]
context = "llm-evaluation"
definition = "Five kinds of plausible wrong number: fan-out, a definition the schema doesn't hold, time zones and the fiscal calendar, a tempting table, and an unwritten filter."
section = "wrong-numbers-decisions"
example = "classify-schema-only-errors"

[[concepts]]
id = "public-benchmark"
term = "public benchmark"
aliases = ["public benchmarks"]
context = "llm-evaluation"
definition = "A public benchmark for text-to-SQL or data agents gives you questions, a database and a gold answer for each question, and a score that others have reported on the same set."
section = "benchmarks-are-not-your-test"
example = "public-vs-own-score"
agrees = [{ book = "evaluating-llm-applications", definition = "A public benchmark is a set of questions and answers someone else published." }]

[concepts.relations]
contrasts-with = ["golden-question"]


[[concepts]]
id = "dabstep"
term = "DABstep"
aliases = ["Data Agent Benchmark for Multi-step Reasoning"]
context = "llm-evaluation"
definition = "DABstep asks questions about a payments processor's transactions, scores only the final answer, and keeps the answers to most of its tasks hidden for its leaderboard"
section = "benchmarks-are-not-your-test"
example = "public-vs-own-score"

[concepts.relations]
broader = ["public-benchmark"]

[[concepts]]
id = "kind"
term = "question kind"
context = "llm-evaluation"
definition = "A golden question's `kind` says what a right answer looks like: `answer` when the warehouse can answer it, `decline` when it can't, and `forbidden` when the role may not see the answer."
section = "write-golden-questions"
example = "load-golden-questions"
agrees = [{ book = "evaluating-llm-applications", definition = "Each item also has a kind, which says what a correct reply looks like." }]

[concepts.relations]
part-of = ["golden-question"]

[[concepts]]
id = "execution-match"
term = "execution match"
context = "llm-evaluation"
definition = "An execution match means the agent's result equals the golden result under the question's comparison rule."
section = "compare-results-not-sql"
example = "results-match-rules"

[concepts.relations]
measured-from = ["golden-question"]

[[concepts]]
id = "execution-accuracy"
term = "execution accuracy"
context = "llm-evaluation"
definition = "execution accuracy, which compares the rows each query returns"
section = "compare-results-not-sql"

[[concepts]]
id = "comparison-tolerance"
term = "tolerance"
aliases = ["absolute slack"]
context = "llm-evaluation"
definition = "Numbers must agree with the gold within {{out:tolerant-comparison:tolerance}} by default, plus an absolute slack of half a unit in the last place the gold rounds to."
section = "order-rounding-names"
example = "tolerant-comparison"

[concepts.relations]
part-of = ["comparison-rule"]

[[concepts]]
id = "check-query"
term = "check query"
aliases = ["check_sql", "check queries"]
context = "llm-evaluation"
definition = "Where you can, a second query written another way, the gold's `check_sql`, must return the same result as the golden SQL."
section = "check-the-gold"
example = "gold-runs-and-agrees"

[concepts.relations]
part-of = ["golden-question"]


[[concepts]]
id = "ambiguous-question"
term = "ambiguous question"
aliases = ["ambiguous questions"]
context = "llm-evaluation"
definition = "An ambiguous question, such as \"Who are our best customers?\", has several reasonable answers, and the agent should say which choices it needs."
section = "cover-declines-and-roles"
example = "golden-coverage"

[concepts.relations]
contrasts-with = ["unanswerable-item"]
narrower = ["ambiguous-select-column"]

[[concepts]]
id = "unanswerable-item"
term = "unanswerable question"
aliases = ["unanswerable questions"]
context = "llm-evaluation"
definition = "An unanswerable question, such as the cost of shipping, asks for data the warehouse doesn't hold, and the agent should say so."
section = "cover-declines-and-roles"
example = "golden-coverage"
agrees = [{ book = "evaluating-llm-applications", definition = "Unanswerable items ask about something the docs don't cover, and the right reply is the decline." }]

[concepts.relations]
narrower = ["nonexistent-select-column"]

[[concepts]]
id = "forbidden-question"
term = "forbidden question"
aliases = ["forbidden questions"]
context = "llm-evaluation"
definition = "A forbidden question is answerable, but not for the role asking: the shop's finance team may not see customers' emails, and a regional lead may see only their own region."
section = "cover-declines-and-roles"
example = "golden-coverage"

[concepts.relations]
broader = ["golden-question"]

[[concepts]]
id = "held-out"
term = "held-out split"
aliases = ["held-out set", "test split"]
context = "llm-evaluation"
definition = "A held-out split is the usual defence: tune on one part, and score the other only when you report a result."
section = "hold-out-a-test-split"
example = "baseline-on-both-splits"
agrees = [{ book = "evaluating-llm-applications", definition = "held-out is used once, to report a result." }]

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/artificial-intelligence/test-split"]


[[concepts]]
id = "layered-context"
term = "layered context"
definition = "Layered context is the most direct fix for what a schema can't say: write the rules down where the model reads them."
section = "layered-context"

[concepts.relations]
contrasts-with = ["data-warehousing/semantic-layer"]

[[concepts]]
id = "schema"
term = "schema"
aliases = ["schemas"]
context = "data-warehousing"
definition = "A schema tells a model which tables exist, what their columns are called and what type each column holds."
section = "what-the-schema-says"

[concepts.relations]
part-of = ["layered-context"]


[[concepts]]
id = "schema-layer"
term = "schema layer"
definition = "The schema layer is the whole warehouse: all {{out:schema-digest:tables in the schema}} tables, about {{out:schema-digest:schema tokens (estimated)}} tokens."
section = "what-the-schema-says"
example = "schema-digest"

[concepts.relations]
part-of = ["layered-context"]

[[concepts]]
id = "column-note"
term = "column note"
aliases = ["column notes"]
definition = "A column note is a sentence about one table or column that says what its name doesn't: which rows the table holds, the unit and sign of an amount, the time zone of a timestamp, the values a column takes, or that a table is deprecated."
section = "describe-columns"
example = "column-descriptions"

[concepts.relations]
part-of = ["layered-context"]

[[concepts]]
id = "business-glossary"
term = "business glossary"
aliases = ["glossary"]
definition = "A business glossary lists the business words whose meaning a company's teams chose, and writes each meaning in terms of the warehouse's tables and columns."
section = "add-the-glossary"
example = "glossary-context"

[concepts.relations]
part-of = ["layered-context"]

[[concepts]]
id = "bird"
term = "BIRD"
context = "llm-evaluation"
definition = "BIRD, a text-to-SQL benchmark whose questions come with \"external knowledge evidence\""
section = "add-the-glossary"

[concepts.relations]
broader = ["public-benchmark"]


[[concepts]]
id = "external-knowledge-evidence"
term = "external knowledge evidence"
context = "llm-evaluation"
definition = "hints that link a question's words to the database, such as what a term means as a formula over columns"
section = "add-the-glossary"

[concepts.relations]
part-of = ["bird"]

[[concepts]]
id = "verified-query"
term = "verified query"
aliases = ["verified queries"]
definition = "A verified query shows the shop's rules applied: a question someone asked, with SQL a person checked against the shop's definitions."
section = "retrieve-verified-queries"
example = "retrieve-similar-queries"

[concepts.relations]
part-of = ["layered-context", "verified-query-repository"]

[[concepts]]
id = "verified-query-repository"
term = "verified query repository"
definition = "Snowflake's Cortex Analyst keeps a verified query repository of \"questions and corresponding SQL queries to answer them\""
section = "retrieve-verified-queries"

[[concepts]]
id = "lexical-retrieval"
term = "lexical retrieval"
definition = "Lexical retrieval matches words"
section = "layered-context-in-production"
example = "retrieve-similar-queries"

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/search-and-recommendation/lexical-retrieval"]


[[concepts]]
id = "token-budget"
term = "token budget"
context = "large-language-models"
definition = "A token budget is the most context the agent may send with one question."
section = "fit-a-context-budget"
example = "context-token-budget"

[[concepts]]
id = "token-estimate"
term = "token estimate"
context = "large-language-models"
definition = "Token counts in lib/context.py are estimates: estimate_tokens() divides the number of characters by 3.5, because the examples don't load the model's tokenizer."
section = "fit-a-context-budget"
example = "context-token-budget"

[[concepts]]
id = "ablation"
term = "ablation"
aliases = ["ablations"]
context = "llm-evaluation"
definition = "An ablation measures every layer the same way: it scores a series of configurations that differ by one layer each, on the same questions, under the same comparison rule."
