[[concepts]]
id = "structured-content"
term = "structured content"
aliases = ["structuredContent"]
context = "ai-agents"
definition = "Structured content, the JSON a tool returns in `structuredContent`, is what lets a host's code, rather than its model, read an answer's role and filters."
section = "return-provenance"
