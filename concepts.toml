[[concepts]]
id = "tool-reply"
term = "ToolReply"
context = "ai-agents"
definition = "Every tool of the semantic server returns a `ToolReply`, a pydantic model with two fields: `text`, the text the in-process tool shows the model, and `answer`, the answer with its rows and provenance, or nothing when the result doesn't end the run."
section = "return-provenance"
example = "tool-result-with-provenance"

[[concepts]]
id = "tool-execution-error"
term = "tool execution error"
aliases = ["tool error", "tool errors", "ToolError"]
context = "ai-agents"
definition = "The MCP specification reports a tool execution error as a result with `isError` set, with \"actionable feedback that language models can use to self-correct\""
section = "return-provenance"
example = "tool-result-with-provenance"
agrees = [{ book = "model-context-protocol-in-practice", definition = "A tool execution error is an ordinary result with isError set to true, for an API failure, an invalid input or a broken business rule." }]

