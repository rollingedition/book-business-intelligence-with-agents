"""

[[queries]]
name = "refund_rate_by_order_month"
question = "What was the refund rate for orders placed in each quarter of calendar 2024?"
role = "finance"
verified_at = "2026-10-15"
verified_by = "finance team"
sql = """
WITH orders AS (
    SELECT quarter(o.order_date_local) AS quarter, sum(o.gross_revenue_eur) AS gross_revenue
    FROM analytics.fct_orders AS o
    WHERE o.status <> 'cancelled' AND year(o.order_date_local) = 2024
    GROUP BY quarter
), refunds AS (
    SELECT quarter(r.order_month) AS quarter, sum(r.amount_eur) AS refunded
    FROM analytics.fct_refunds AS r
    WHERE year(r.order_month) = 2024
    GROUP BY quarter
)
SELECT o.quarter, round(coalesce(r.refunded, 0) / o.gross_revenue, 4) AS refund_rate
FROM orders AS o LEFT JOIN refunds AS r USING (quarter)
ORDER BY o.quarter
"""

[[queries]]
name = "net_revenue_by_category"
question = "Which product categories brought in the most net revenue in fiscal year 2025?"
role = "analyst"
verified_at = "2026-10-15"
verified_by = "analytics engineering"
sql = """
SELECT p.category, round(sum(l.net_amount_eur), 2) AS net_revenue
FROM analytics.fct_order_lines AS l
JOIN analytics.fct_orders AS o USING (order_id)
JOIN analytics.dim_products AS p USING (product_id)
JOIN analytics.dim_date AS d ON d.date_day = o.order_date_local
WHERE o.status <> 'cancelled' AND d.fiscal_year = 2025
GROUP BY p.category
ORDER BY net_revenue DESC
"""

[[queries]]
name = "units_sold_by_product"
question = "Which five products sold the most units in calendar year 2025?"
role = "analyst"
verified_at = "2026-10-15"
verified_by = "analytics engineering"
sql = """
SELECT p.product_name, sum(l.quantity) AS units
FROM analytics.fct_order_lines AS l
JOIN analytics.fct_orders AS o USING (order_id)
JOIN analytics.dim_products AS p USING (product_id)
WHERE o.status <> 'cancelled' AND year(o.order_date_local) = 2025
GROUP BY p.product_name
ORDER BY units DESC
LIMIT 5
"""

[[queries]]
