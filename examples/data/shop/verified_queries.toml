# Verified queries: questions people asked, with SQL a person checked against the shop's definitions, written for the
# book; CC BY 4.0. The fields follow Snowflake's verified query repository (name, question, sql, verified_at) plus the
# role the query was verified for. `verified_by` names a team, never a person. None of these is a golden question:
# they are examples the agent may adapt, and the golden questions test whether it adapts them correctly.

[[queries]]
name = "net_revenue_by_fiscal_quarter"
question = "What was net revenue in each fiscal quarter of fiscal year 2025?"
role = "finance"
verified_at = "2026-10-12"
verified_by = "finance team"
sql = """
SELECT d.fiscal_quarter, round(sum(o.net_revenue_eur), 2) AS net_revenue
FROM analytics.fct_orders AS o
JOIN analytics.dim_date AS d ON d.date_day = o.order_date_local
WHERE o.status <> 'cancelled' AND d.fiscal_year = 2025
GROUP BY d.fiscal_quarter
ORDER BY d.fiscal_quarter
"""

[[queries]]
name = "gross_revenue_by_region_month"
question = "What was gross revenue by region in January 2025?"
role = "finance"
verified_at = "2026-10-12"
verified_by = "finance team"
sql = """
SELECT o.region, round(sum(o.gross_revenue_eur), 2) AS gross_revenue
FROM analytics.fct_orders AS o
WHERE o.status <> 'cancelled' AND o.order_date_local >= DATE '2025-01-01' AND o.order_date_local < DATE '2025-02-01'
GROUP BY o.region
"""

[[queries]]
name = "orders_by_channel_week"
question = "How many orders came through each sales channel in the first week of June 2025?"
role = "analyst"
verified_at = "2026-10-12"
verified_by = "analytics engineering"
sql = """
SELECT o.channel, count(*) AS orders
FROM analytics.fct_orders AS o
WHERE o.order_date_local BETWEEN DATE '2025-06-01' AND DATE '2025-06-07'
GROUP BY o.channel
"""

[[queries]]
name = "average_order_value_by_region"
question = "What was the average order value in each region in calendar year 2024?"
role = "finance"
verified_at = "2026-10-13"
verified_by = "finance team"
sql = """
SELECT o.region, round(sum(o.net_revenue_eur) / count(*), 2) AS average_order_value
FROM analytics.fct_orders AS o
WHERE o.status <> 'cancelled' AND year(o.order_date_local) = 2024
GROUP BY o.region
"""

[[queries]]
name = "cancelled_orders_by_month"
question = "How many orders were cancelled each month in the first half of 2025?"
role = "analyst"
verified_at = "2026-10-13"
verified_by = "analytics engineering"
sql = """
SELECT date_trunc('month', o.order_date_local) AS month, count(*) AS cancelled_orders
FROM analytics.fct_orders AS o
WHERE o.status = 'cancelled' AND o.order_date_local BETWEEN DATE '2025-01-01' AND DATE '2025-06-30'
GROUP BY month
ORDER BY month
"""

