[[queries]]
name = "late_refunds_share"
question = "What share of refunds in calendar year 2025 were paid in a later month than the order?"
role = "finance"
verified_at = "2026-10-17"
verified_by = "finance team"
sql = """
SELECT round(count(*) FILTER (WHERE r.refund_month > r.order_month) / count(*), 4) AS late_share
FROM analytics.fct_refunds AS r
WHERE year(r.refund_month) = 2025
"""
