[[queries]]
name = "refunds_paid_by_month"
question = "How much did we refund in each month of fiscal year 2025?"
role = "finance"
verified_at = "2026-10-14"
verified_by = "finance team"
sql = """
SELECT r.refund_month, round(sum(r.amount_eur), 2) AS refunded
FROM analytics.fct_refunds AS r
JOIN analytics.dim_date AS d ON d.date_day = r.refund_month
WHERE d.fiscal_year = 2025
GROUP BY r.refund_month
ORDER BY r.refund_month
"""

[[queries]]
name = "refunds_by_reason"
