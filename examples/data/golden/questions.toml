[[questions]]
question_id = "gq-031"
question = "How many units did an order contain on average in 2025, counting quantities, not order lines?"
role = "analyst"
kind = "answer"
split = "test"
golden_sql = """
SELECT round(sum(l.quantity) / count(DISTINCT o.order_id), 4) AS units_per_order
FROM analytics.fct_orders AS o
JOIN analytics.fct_order_lines AS l USING (order_id)
WHERE o.status <> 'cancelled' AND year(o.order_date_local) = 2025
"""
absolute = 0.00005
traps = ["fan-out", "cancelled-orders"]
note = "Units: the sum of quantity over an order's lines, averaged over orders that weren't cancelled, not the number of lines (line_count). An earlier wording said items, which allowed both readings. A ratio, so the gold rounds to four places and the absolute slack is half that last place."

[[questions]]
question_id = "gq-032"
question = "What was our gross margin in euros on products sold in 2025?"
role = "finance"
kind = "answer"
split = "test"
golden_sql = """
SELECT round(sum(l.net_amount_eur - l.quantity * p.unit_cost), 2) AS gross_margin
FROM analytics.fct_order_lines AS l
JOIN analytics.fct_orders AS o USING (order_id)
JOIN analytics.dim_products AS p USING (product_id)
WHERE o.status <> 'cancelled' AND year(o.order_date_local) = 2025
"""
traps = ["net-vs-gross", "cancelled-orders"]
note = "Gross margin: net amount of each line less quantity times unit cost, before refunds."

[[questions]]
question_id = "gq-033"
question = "What share of sessions in each channel led to an order in 2025?"
role = "marketing"
kind = "answer"
split = "test"
golden_sql = """
SELECT s.channel, round(count(o.order_id) / count(*), 4) AS conversion_rate
FROM analytics.fct_sessions AS s
LEFT JOIN analytics.fct_orders AS o ON o.order_id = s.converted_order_id AND o.status <> 'cancelled'
WHERE year(s.started_at) = 2025
GROUP BY s.channel
"""
absolute = 0.00005
traps = ["null-channel", "test-orders", "cancelled-orders"]
note = "A session converts when its order is real and wasn't cancelled. As a fraction, by the session's UTC year."

[[questions]]
question_id = "gq-034"
question = "What was the return on marketing spend for paid search in 2025?"
role = "marketing"
kind = "answer"
split = "test"
golden_sql = """
SELECT round(
    (SELECT sum(o.net_revenue_eur) FROM analytics.fct_sessions AS s
     JOIN analytics.fct_orders AS o ON o.order_id = s.converted_order_id
     WHERE s.channel = 'paid_search' AND o.status <> 'cancelled' AND year(s.started_at) = 2025)
    / (SELECT sum(amount_eur) FROM raw.marketing_spend WHERE channel = 'paid_search' AND year(spend_date) = 2025),
    4) AS return_on_spend
"""
absolute = 0.00005
traps = ["definition", "test-orders", "cancelled-orders"]
note = "Net revenue of orders converted from paid-search sessions, divided by paid-search spend, both in 2025."

