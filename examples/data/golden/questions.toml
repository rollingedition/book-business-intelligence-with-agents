golden_sql = """
SELECT round(sum(o.discount_eur), 2) AS discount
FROM analytics.fct_orders AS o
JOIN analytics.dim_date AS d ON d.date_day = o.order_date_local
WHERE o.status <> 'cancelled' AND d.fiscal_year = 2026
"""
check_sql = """
SELECT round(sum(l.discount_eur), 2) AS discount
FROM analytics.fct_order_lines AS l
JOIN analytics.fct_orders AS o USING (order_id)
WHERE o.status <> 'cancelled' AND o.order_date_local BETWEEN DATE '2025-02-01' AND DATE '2026-01-31'
"""
traps = ["fiscal-calendar", "currency"]
note = "Discounts are stored as negative amounts in raw order lines and as positive euros in the marts."

