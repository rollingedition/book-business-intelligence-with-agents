[[questions]]
question_id = "gq-028"
question = "Which country had the highest refund rate in fiscal year 2026?"
role = "analyst"
kind = "answer"
split = "test"
golden_sql = """
WITH orders AS (
    SELECT o.order_id, o.country, o.gross_revenue_eur
    FROM analytics.fct_orders AS o
    JOIN analytics.dim_date AS d ON d.date_day = o.order_date_local
    WHERE o.status <> 'cancelled' AND d.fiscal_year = 2026
)
SELECT o.country
FROM orders AS o
LEFT JOIN analytics.fct_refunds AS r USING (order_id)
GROUP BY o.country
ORDER BY coalesce(sum(r.amount_eur), 0) / sum(o.gross_revenue_eur) DESC
LIMIT 1
"""
check_sql = """
SELECT country
FROM (SELECT o.country,
             (SELECT sum(r.amount_eur) FROM analytics.fct_refunds AS r JOIN analytics.fct_orders AS x USING (order_id)
              JOIN analytics.dim_date AS d ON d.date_day = x.order_date_local
              WHERE x.country = o.country AND x.status <> 'cancelled' AND d.fiscal_year = 2026)
             / sum(o.gross_revenue_eur) AS rate
      FROM analytics.fct_orders AS o
      JOIN analytics.dim_date AS d ON d.date_day = o.order_date_local
      WHERE o.status <> 'cancelled' AND d.fiscal_year = 2026
      GROUP BY o.country)
ORDER BY rate DESC
LIMIT 1
"""
traps = ["definition", "late-refunds", "fan-out"]
note = "Refund rate: refunded euros over gross revenue of the same orders (placed in the period, not cancelled). By count of refunds, another country leads."

