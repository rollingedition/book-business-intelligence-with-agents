[[questions]]
question_id = "gq-006"
question = "What were net revenue and the number of units sold in each region in 2025?"
role = "analyst"
kind = "answer"
split = "dev"
traps = ["fan-out"]
golden_sql = """
SELECT o.region, round(sum(o.net_revenue_eur), 2) AS net_revenue, sum(l.units) AS units_sold
FROM analytics.fct_orders AS o
JOIN (SELECT order_id, sum(quantity) AS units FROM analytics.fct_order_lines GROUP BY order_id) AS l USING (order_id)
WHERE o.status <> 'cancelled' AND year(o.order_date_local) = 2025
GROUP BY o.region
"""
note = "Tests fan-out: lines are summed per order before the join, so each order's revenue counts once."

[[questions]]
question_id = "gq-007"
question = "How much net revenue came from orders that included a tent in 2025?"
role = "analyst"
kind = "answer"
split = "dev"
traps = ["fan-out"]
golden_sql = """
SELECT round(sum(o.net_revenue_eur), 2) AS net_revenue
FROM analytics.fct_orders AS o
WHERE o.status <> 'cancelled' AND year(o.order_date_local) = 2025
  AND o.order_id IN (SELECT l.order_id FROM analytics.fct_order_lines AS l
                     JOIN analytics.dim_products AS p USING (product_id) WHERE p.category = 'Tents')
"""
note = "Tests fan-out: an order with two tent lines counts once. Whole-order revenue, not only the tents' lines."

