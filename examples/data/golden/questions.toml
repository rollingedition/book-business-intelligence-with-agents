# The shop's golden questions: each with its verified answer (golden SQL), the role that asks it and the kind of
# answer expected. Written for the book; CC BY 4.0. Net revenue, as the shop's finance team defines it: revenue in EUR
# after discounts and before tax, from real (non-test) orders that weren't cancelled, on the order's local business day.
# Order counts include cancelled orders and exclude test orders. 48 questions: 24 in the dev split, for tuning prompts
# and context, and 24 in the test split, held out and scored only for a chapter's final numbers. kind is answer,
# decline (decline_type: ambiguous or unanswerable) or forbidden (the role may not see the answer). traps names what
# each question tests; check_sql, where present, is an independent query that must return the golden result.

[[questions]]
question_id = "gq-001"
question = "What was our net revenue in fiscal year 2026?"
role = "analyst"
kind = "answer"
split = "dev"
traps = ["fiscal-calendar", "cancelled-orders", "net-vs-gross"]
check_sql = """
SELECT round(sum(l.net_amount_eur), 2) AS net_revenue
FROM analytics.fct_order_lines AS l
JOIN analytics.fct_orders AS o USING (order_id)
WHERE o.status <> 'cancelled' AND o.order_date_local BETWEEN DATE '2025-02-01' AND DATE '2026-01-31'
"""
golden_sql = """
SELECT round(sum(o.net_revenue_eur), 2) AS net_revenue
FROM analytics.fct_orders AS o
JOIN analytics.dim_date AS d ON d.date_day = o.order_date_local
WHERE o.status <> 'cancelled' AND d.fiscal_year = 2026
"""
note = "Fiscal 2026 runs Feb 1, 2025 to Jan 31, 2026. Tests net versus gross, cancelled orders and the fiscal calendar."

[[questions]]
question_id = "gq-002"
question = "What was net revenue in each region in March 2026?"
role = "analyst"
kind = "answer"
split = "dev"
traps = ["vat", "currency", "local-business-day", "cancelled-orders"]
check_sql = """
SELECT o.region, round(sum(l.net_amount_eur), 2) AS net_revenue
FROM analytics.fct_order_lines AS l
JOIN analytics.fct_orders AS o USING (order_id)
WHERE o.status <> 'cancelled' AND o.order_date_local >= DATE '2026-03-01' AND o.order_date_local < DATE '2026-04-01'
GROUP BY o.region
"""
golden_sql = """
SELECT o.region, round(sum(o.net_revenue_eur), 2) AS net_revenue
FROM analytics.fct_orders AS o
WHERE o.status <> 'cancelled' AND o.order_date_local BETWEEN DATE '2026-03-01' AND DATE '2026-03-31'
GROUP BY o.region
"""
note = "Tests VAT-inclusive EMEA prices, currencies and local business days at the month's edges."

